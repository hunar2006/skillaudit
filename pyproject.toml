[project]
name = "skillaudit"
version = "0.1.0"
description = "Find Claude skills on your machine, trace where they came from, and flag risk a fork added."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
skillaudit = "skillaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skillaudit*"]

[tool.setuptools.package-data]
skillaudit = ["catalog/**/*", "catalog/**/.*"]
